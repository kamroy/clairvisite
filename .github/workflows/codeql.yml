name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Hebdomadaire : capte les nouvelles règles CodeQL même sans nouveau commit.
    - cron: "23 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # Pas de build : l'analyse JS/TS de CodeQL n'a pas besoin de compiler le code.
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
