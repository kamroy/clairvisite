# Lancement local : copiez .env.example en .env à la racine, puis `docker compose up`.
# Pensé pour le développement (hot-reload via bind mount) — pas pour la production.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-clairvisite}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-clairvisite}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin123}
    ports:
      # 9000/9001 déjà pris par un autre projet sur cette machine -> remappés en 90{10,11}.
      - "9010:9000" # API S3 (http://localhost:9010)
      - "9011:9001" # Console web (http://localhost:9011)
    volumes:
      - minio_data:/data

  server:
    build:
      context: ./server
    # db push (pas de dossier prisma/migrations dans ce projet) + seed des régions
    # (idempotents tous les deux) avant de démarrer en mode watch.
    command: sh -c "npx prisma db push --skip-generate && npx prisma db seed && npm run start:dev"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-clairvisite}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-your-local-env}
      API_BASE_URL: http://localhost:3000/api
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/google/callback
      # Vide = l'appli démarre quand même, mais l'envoi d'email (vérification de
      # compte, confirmation de réservation) échoue silencieusement en arrière-plan.
      RESEND_API_KEY: ${RESEND_API_KEY:-re_dev_placeholder}
      # Doit correspondre à l'origine exacte utilisée par le navigateur (vérifiée par
      # le CORS du serveur) : http://localhost:5173 normalement, ou l'IP WSL2 si vous
      # passez par elle en solution de contournement (voir CLIENT_URL dans .env).
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      PORT: 3000
      # Requis par prisma/seed.ts depuis qu'il n'a plus de mot de passe par défaut
      # codé en dur (voir la doc du seed) — ce défaut-ci est un défaut de dev local
      # explicite dans l'infra, pas un secret caché dans le code applicatif.
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@clairvisite.fr}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-ChangeMoi123!}
      # MinIO en local (S3-compatible) — voir src/infrastructure/storage/.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: clairvisite-files
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin123}
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      # Volume nommé dédié : évite d'écraser les node_modules de l'image (compilés
      # pour Linux/Alpine, ex. bcrypt) par ceux du host via le bind mount du dessus.
      - server_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  client:
    build:
      context: ./client
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://server:3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  pgdata:
  minio_data:
  server_node_modules:
  client_node_modules:
